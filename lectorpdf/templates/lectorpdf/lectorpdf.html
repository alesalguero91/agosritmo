<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Notas PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .processing {
            background-color: #d9edf7;
            color: #31708f;
        }
        .cleanup {
            background-color: #fcf8e3;
            color: #8a6d3b;
        }
        .repetido {
            background-color: #fff3e0;
            color: #e65100;
        }
        #resultsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #resultsTable th, #resultsTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #resultsTable th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        #resultsTable tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        #resultsTable tr.processing-row {
            background-color: #e6f3ff;
        }
        #resultsTable tr.error-row {
            background-color: #ffebee;
        }
        #resultsTable tr.repetido-row {
            background-color: #fff3e0;
        }
        .export-btn {
            background-color: #2196F3;
            margin-top: 10px;
        }
        .export-btn:hover {
            background-color: #0b7dda;
        }
        .hidden {
            display: none;
        }
        #fileInfo {
            margin-top: 5px;
            font-size: 0.9em;
            color: #666;
        }
        .file-name {
            font-weight: bold;
            color: #333;
        }
        .numero-cliente {
            color: #4CAF50;
            font-weight: bold;
        }
        #selectedFilesList {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-status {
            font-style: italic;
            color: #666;
        }
        .status-pending {
            color: #FF9800;
        }
        .status-processing {
            color: #2196F3;
        }
        .status-completed {
            color: #4CAF50;
        }
        .status-error {
            color: #F44336;
        }
        .status-repetido {
            color: #FF9800;
            font-weight: bold;
        }
        .progress-container {
            width: 100%;
            background-color: #f1f1f1;
            border-radius: 4px;
            margin-top: 10px;
        }
        .progress-bar {
            height: 20px;
            background-color: #4CAF50;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
            text-align: center;
            color: white;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <h1>Generador de Notas PDF</h1>
    
    <form id="notaForm" enctype="multipart/form-data" onsubmit="event.preventDefault();">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="archivos">Comprobantes (PDF o imágenes):</label>
            <input type="file" id="archivos" name="archivos" accept=".pdf,.jpg,.jpeg,.png" multiple required>
            <div id="fileInfo">
                <div id="selectedFilesCount">0 archivos seleccionados</div>
                <div id="selectedFilesList"></div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="excelFile">Archivo Excel de Clientes:</label>
            <input type="file" id="excelFile" name="excelFile" accept=".xlsx,.xls" required>
        </div>
        
        <div class="progress-container hidden" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <div>
            <button type="button" id="generateBtn" onclick="procesarArchivos()">Generar Notas PDF</button>
            <button type="button" onclick="limpiarTodo()" style="background-color: #f0ad4e;">Limpiar Todo</button>
            <button id="exportExcelBtn" class="export-btn hidden" onclick="exportToExcel()">Exportar a Excel</button>
        </div>
    </form>
    
    <div id="result"></div>
    
    <div id="tableContainer">
        <h2>Historial de Operaciones</h2>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>N° Cliente</th>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Importe</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <!-- Las filas se agregarán dinámicamente -->
            </tbody>
        </table>
    </div>
    
    <script>
        const API_BASE_URL = window.location.origin;
        let operationsHistory = [];
        let selectedFiles = [];
        let currentProcessingIndex = 0;
        let isProcessing = false;

        function extractNumeroClienteFromFileName(fileName) {
            const cleanedName = fileName.replace(/\([^)]*\)/g, '');
            const nameWithoutExt = cleanedName.split('.').slice(0, -1).join('.');
            const matches = nameWithoutExt.match(/\d+/g);
            
            if (matches && matches.length > 0) {
                return matches[0];
            }
            
            return null;
        }

        function esOperacionRepetida(numeroCliente, importe) {
            return operationsHistory.some(op => 
                op.numero === numeroCliente && 
                op.importe === importe && 
                (op.estado === 'Completado' || op.estado === 'Repetido')
            );
        }

        document.getElementById('archivos').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            updateSelectedFilesList();
        });

        function updateSelectedFilesList() {
            const filesListDiv = document.getElementById('selectedFilesList');
            const filesCountDiv = document.getElementById('selectedFilesCount');
            
            filesCountDiv.textContent = `${selectedFiles.length} archivo(s) seleccionado(s)`;
            
            if (selectedFiles.length === 0) {
                filesListDiv.innerHTML = '<p>No hay archivos seleccionados</p>';
                return;
            }
            
            filesListDiv.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const numeroCliente = extractNumeroClienteFromFileName(file.name);
                const clienteDisplay = numeroCliente ? `(Cliente: ${numeroCliente})` : '(N° cliente no detectado)';
                
                fileItem.innerHTML = `
                    <span class="file-name">${file.name}</span>
                    <span class="file-status status-pending">Pendiente</span>
                `;
                filesListDiv.appendChild(fileItem);
            });
        }

        function mostrarResultado(mensaje, esError = false, esProcesando = false, esLimpieza = false, esRepetido = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = mensaje;
            resultDiv.className = esError ? 'error' : 
                                 esProcesando ? 'processing' :
                                 esLimpieza ? 'cleanup' :
                                 esRepetido ? 'repetido' :
                                 'success';
        }

        function limpiarTodo() {
            document.getElementById('archivos').value = '';
            document.getElementById('excelFile').value = '';
            document.getElementById('selectedFilesList').innerHTML = '<p>No hay archivos seleccionados</p>';
            document.getElementById('selectedFilesCount').textContent = '0 archivos seleccionados';
            selectedFiles = [];
            mostrarResultado('✅ Todos los campos fueron limpiados', false, false, true);
            document.getElementById('progressContainer').classList.add('hidden');
        }

        function updateProgress(processed, total) {
            const progress = Math.round((processed / total) * 100);
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${progress}%`;
            progressBar.textContent = `${progress}%`;
        }

        function addToResultsTable(operationData) {
            operationsHistory.push(operationData);
            
            const tableBody = document.getElementById('resultsTableBody');
            const row = document.createElement('tr');
            row.id = `row-${operationData.id}`;
            
            if (operationData.estado === 'Procesando') {
                row.classList.add('processing-row');
            } else if (operationData.estado === 'Error') {
                row.classList.add('error-row');
            } else if (operationData.estado === 'Repetido') {
                row.classList.add('repetido-row');
            }
            
            row.innerHTML = `
                <td>${operationData.numero}</td>
                <td>${operationData.nombre}</td>
                <td>${operationData.dni}</td>
                <td>${operationData.importe}</td>
                <td class="status-${operationData.estado.toLowerCase()}">${operationData.estado}</td>
            `;
            
            if (tableBody.firstChild) {
                tableBody.insertBefore(row, tableBody.firstChild);
            } else {
                tableBody.appendChild(row);
            }
            
            document.getElementById('exportExcelBtn').classList.remove('hidden');
        }

        function updateRowStatus(id, newStatus, importe = '') {
            const row = document.getElementById(`row-${id}`);
            if (row) {
                const statusCell = row.querySelector('td:last-child');
                statusCell.textContent = newStatus;
                statusCell.className = `status-${newStatus.toLowerCase()}`;
                
                if (newStatus === 'Error') {
                    row.classList.add('error-row');
                    row.classList.remove('processing-row', 'repetido-row');
                } else if (newStatus === 'Completado') {
                    row.classList.remove('processing-row', 'repetido-row');
                    if (importe) {
                        row.cells[3].textContent = importe;
                    }
                } else if (newStatus === 'Repetido') {
                    row.classList.add('repetido-row');
                    row.classList.remove('processing-row');
                    if (importe) {
                        row.cells[3].textContent = importe;
                    }
                }
            }
        }

        function exportToExcel() {
            if (operationsHistory.length === 0) {
                mostrarResultado('❌ No hay datos para exportar', true);
                return;
            }

            const completedOperations = operationsHistory.filter(op => op.estado === 'Completado');
            
            if (completedOperations.length === 0) {
                mostrarResultado('❌ No hay operaciones completadas para exportar', true);
                return;
            }

            const wb = XLSX.utils.book_new();
            
            const datos = [
                ["N° Cliente", "Nombre", "DNI", "Importe", "Estado"],
                ...completedOperations.map(op => [
                    op.numero,
                    op.nombre,
                    op.dni,
                    op.importe,
                    op.estado
                ])
            ];
            
            const ws = XLSX.utils.aoa_to_sheet(datos);
            
            ws['!cols'] = [
                {wch: 12},
                {wch: 25},
                {wch: 15},
                {wch: 15},
                {wch: 12}
            ];
            
            XLSX.utils.book_append_sheet(wb, ws, "Historial");
            
            const excelBuffer = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
            
            const blob = new Blob([excelBuffer], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `historial_notas_${new Date().toISOString().slice(0,10)}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            mostrarResultado('✅ Archivo Excel generado y descargado');
        }

        async function procesarArchivos() {
            if (isProcessing) return;
            
            const excelInput = document.getElementById('excelFile');
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            const generateBtn = document.getElementById('generateBtn');
            
            if (selectedFiles.length === 0 || !excelInput.files[0]) {
                mostrarResultado('❌ Por favor complete todos los campos', true);
                return;
            }

            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.textContent = 'Procesando...';
            document.getElementById('progressContainer').classList.remove('hidden');
            updateProgress(0, selectedFiles.length);
            
            for (let i = 0; i < selectedFiles.length; i++) {
                currentProcessingIndex = i;
                const archivo = selectedFiles[i];
                const numeroCliente = extractNumeroClienteFromFileName(archivo.name);
                
                let excelData = {};
                try {
                    excelData = await parseExcel(excelInput.files[0], numeroCliente);
                } catch (error) {
                    excelData = {
                        nombre: 'No encontrado',
                        dni: 'No encontrado'
                    };
                }
                
                const operationId = `op-${Date.now()}-${i}`;
                addToResultsTable({
                    id: operationId,
                    numero: numeroCliente || 'N/A',
                    nombre: excelData.nombre || 'No encontrado',
                    dni: excelData.dni || 'No encontrado',
                    importe: 'Procesando...',
                    estado: 'Procesando'
                });
                
                try {
                    if (!numeroCliente) {
                        throw new Error('No se pudo detectar el número de cliente del nombre del archivo');
                    }

                    const pdfFormData = new FormData();
                    pdfFormData.append('pdf_file', archivo);
                    
                    const extractResponse = await fetch('/upload-pdf/', {
                        method: 'POST',
                        body: pdfFormData,
                        headers: {
                            'X-CSRFToken': csrfToken
                        }
                    });

                    if (!extractResponse.ok) {
                        const errorData = await extractResponse.json();
                        throw new Error(errorData.error || 'Error al extraer texto');
                    }

                    const extractData = await extractResponse.json();
                    console.log('Texto extraído:', extractData.text);

                    let importe = extractData.financial_data?.amount?.toString() || "No encontrado";
                    if (importe === "No encontrado") {
                        const importeMatch = extractData.text.match(/(?:importe|total|monto)[:\s]*\$?\s*([\d,.]+)/i);
                        if (importeMatch && importeMatch[1]) {
                            importe = importeMatch[1].replace('.', '').replace(',', '.');
                        }
                    }

                    const esRepetido = esOperacionRepetida(numeroCliente, importe);
                    const estadoFinal = esRepetido ? 'Repetido' : 'Completado';

                    if (!esRepetido) {
                        const notaFormData = new FormData();
                        notaFormData.append('pdf_file', archivo);
                        notaFormData.append('additional_data', numeroCliente);
                        notaFormData.append('excel_file', excelInput.files[0]);
                        
                        const response = await fetch('/generar-nota/', {
                            method: 'POST',
                            body: notaFormData,
                            headers: {
                                'X-CSRFToken': csrfToken
                            }
                        });

                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.error || 'Error al generar la nota');
                        }

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        
                        const nombreCliente = excelData.nombre || 'cliente';
                        const dniCliente = excelData.dni || '';
                        const fecha = new Date().toISOString().slice(0, 10);
                        a.download = `Nota_${numeroCliente}_${dniCliente}_${nombreCliente.replace(/\s+/g, '_')}_${fecha}.pdf`;
                        
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }

                    updateRowStatus(operationId, estadoFinal, importe);
                    
                    const opIndex = operationsHistory.findIndex(op => op.id === operationId);
                    if (opIndex !== -1) {
                        operationsHistory[opIndex] = {
                            ...operationsHistory[opIndex],
                            importe: importe,
                            estado: estadoFinal
                        };
                    }
                    
                    mostrarResultado(
                        esRepetido ? 
                            `⚠️ ${archivo.name} es repetido (mismo cliente e importe)` : 
                            `✅ ${archivo.name} procesado correctamente (${i+1}/${selectedFiles.length})`,
                        false, 
                        false, 
                        false,
                        esRepetido
                    );
                    
                } catch (error) {
                    console.error(`Error procesando ${archivo.name}:`, error);
                    updateRowStatus(operationId, 'Error');
                    
                    const opIndex = operationsHistory.findIndex(op => op.id === operationId);
                    if (opIndex !== -1) {
                        operationsHistory[opIndex].estado = 'Error';
                    }
                    
                    mostrarResultado(`❌ Error procesando ${archivo.name}: ${error.message}`, true);
                }
                
                updateProgress(i + 1, selectedFiles.length);
            }
            
            isProcessing = false;
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generar Notas PDF';
            mostrarResultado('✅ Procesamiento completado');
        }

        async function parseExcel(excelFile, numeroCliente) {
            return new Promise((resolve, reject) => {
                try {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                            
                            const findColumn = (row, possibleNames) => {
                                const lowerNames = possibleNames.map(n => n.toLowerCase());
                                for (const key in row) {
                                    if (lowerNames.includes(key.toLowerCase())) {
                                        return row[key];
                                    }
                                }
                                return null;
                            };
                            
                            const cliente = jsonData.find(row => {
                                const cuenta = findColumn(row, ['cuenta', 'Cuenta', 'CUENTA', 'account']);
                                return cuenta && cuenta.toString() === numeroCliente.toString();
                            });
                            
                            if (!cliente) {
                                throw new Error(`Cliente con número ${numeroCliente} no encontrado`);
                            }
                            
                            resolve({
                                nombre: findColumn(cliente, ['nombre', 'Nombre', 'NOMBRE', 'name']) || '',
                                dni: findColumn(cliente, ['dni', 'DNI', 'documento']) || ''
                            });
                        } catch (e) {
                            reject(e);
                        }
                    };
                    reader.onerror = () => reject(new Error('Error al leer el archivo Excel'));
                    reader.readAsArrayBuffer(excelFile);
                } catch (e) {
                    reject(e);
                }
            });
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
