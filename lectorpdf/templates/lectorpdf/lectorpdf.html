<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Notas PDF</title>
    <style>
        /* Tus estilos existentes */
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .processing {
            background-color: #d9edf7;
            color: #31708f;
        }
        #resultsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #resultsTable th, #resultsTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #resultsTable th {
            background-color: #f2f2f2;
        }
        .progress-container {
            width: 100%;
            background-color: #f1f1f1;
            border-radius: 4px;
            margin-top: 10px;
        }
        .progress-bar {
            height: 20px;
            background-color: #4CAF50;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
            text-align: center;
            color: white;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <h1>Generador de Notas PDF</h1>
    
    <form id="notaForm" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="archivos">Comprobantes (PDF o imágenes):</label>
            <input type="file" id="archivos" name="archivos" accept=".pdf,.jpg,.jpeg,.png" multiple required>
        </div>
        
        <div class="form-group">
            <label for="excelFile">Archivo Excel de Clientes:</label>
            <input type="file" id="excelFile" name="excelFile" accept=".xlsx,.xls" required>
        </div>
        
        <div class="progress-container hidden" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <button type="button" id="generateBtn">Generar Notas PDF</button>
        <button type="button" id="limpiarBtn">Limpiar Todo</button>
    </form>
    
    <div id="result"></div>
    
    <table id="resultsTable">
        <thead>
            <tr>
                <th>N° Cliente</th>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Importe</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="resultsTableBody">
            <!-- Filas se agregarán dinámicamente -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const limpiarBtn = document.getElementById('limpiarBtn');
            const archivosInput = document.getElementById('archivos');
            const excelFileInput = document.getElementById('excelFile');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const resultDiv = document.getElementById('result');
            const tableBody = document.getElementById('resultsTableBody');
            
            let selectedFiles = [];
            let isProcessing = false;
            let operationsHistory = [];
            
            // Configuración para Render
            const fetchConfig = {
                timeout: 120000, // 2 minutos
                retries: 2,
                retryDelay: 1000
            };
            
            archivosInput.addEventListener('change', function(e) {
                selectedFiles = Array.from(e.target.files);
            });
            
            limpiarBtn.addEventListener('click', limpiarTodo);
            generateBtn.addEventListener('click', procesarArchivos);
            
            function mostrarResultado(mensaje, esError = false) {
                resultDiv.innerHTML = `<div class="${esError ? 'error' : 'success'}">${mensaje}</div>`;
            }
            
            function limpiarTodo() {
                archivosInput.value = '';
                excelFileInput.value = '';
                selectedFiles = [];
                progressContainer.classList.add('hidden');
                mostrarResultado('Todos los campos fueron limpiados');
            }
            
            function updateProgress(processed, total) {
                const progress = Math.round((processed / total) * 100);
                progressBar.style.width = `${progress}%`;
                progressBar.textContent = `${progress}%`;
            }
            
            function addToResultsTable(data) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${data.numero}</td>
                    <td>${data.nombre}</td>
                    <td>${data.dni}</td>
                    <td>${data.importe}</td>
                    <td>${data.estado}</td>
                `;
                tableBody.appendChild(row);
                operationsHistory.push(data);
            }
            
            function updateRowStatus(index, newData) {
                const row = tableBody.children[index];
                if (row) {
                    if (newData.nombre) row.cells[1].textContent = newData.nombre;
                    if (newData.dni) row.cells[2].textContent = newData.dni;
                    if (newData.importe) row.cells[3].textContent = newData.importe;
                    if (newData.estado) row.cells[4].textContent = newData.estado;
                }
            }
            
            async function procesarArchivos() {
                if (isProcessing) return;
                
                if (selectedFiles.length === 0 || !excelFileInput.files[0]) {
                    mostrarResultado('Por favor complete todos los campos', true);
                    return;
                }

                isProcessing = true;
                generateBtn.disabled = true;
                progressContainer.classList.remove('hidden');
                updateProgress(0, selectedFiles.length);
                
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                
                for (let i = 0; i < selectedFiles.length; i++) {
                    const archivo = selectedFiles[i];
                    const numeroCliente = archivo.name.match(/\d+/)?.[0] || 'N/A';
                    
                    addToResultsTable({
                        numero: numeroCliente,
                        nombre: 'Procesando...',
                        dni: 'Procesando...',
                        importe: 'Procesando...',
                        estado: 'Procesando'
                    });
                    
                    try {
                        const formData = new FormData();
                        formData.append('pdf_file', archivo);
                        formData.append('additional_data', numeroCliente);
                        formData.append('excel_file', excelFileInput.files[0]);
                        
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), fetchConfig.timeout);
                        
                        let response;
                        let attempts = 0;
                        
                        while (attempts <= fetchConfig.retries) {
                            try {
                                response = await fetch('/procesar-nota/', {
                                    method: 'POST',
                                    body: formData,
                                    headers: {
                                        'X-CSRFToken': csrfToken
                                    },
                                    signal: controller.signal
                                });
                                clearTimeout(timeoutId);
                                break;
                            } catch (error) {
                                attempts++;
                                if (attempts > fetchConfig.retries) throw error;
                                await new Promise(resolve => setTimeout(resolve, fetchConfig.retryDelay));
                            }
                        }
                        
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => null);
                            throw new Error(errorData?.error || `Error ${response.status}`);
                        }
                        
                        const responseData = await response.json();
                        
                        updateRowStatus(i, {
                            nombre: responseData.cliente_data.nombre,
                            dni: responseData.cliente_data.dni,
                            importe: responseData.text_data.financial_data.amount || 'No encontrado',
                            estado: 'Completado'
                        });
                        
                        // Descargar PDF
                        const byteCharacters = atob(responseData.pdf);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], {type: 'application/pdf'});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `nota_${numeroCliente}.pdf`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        
                        mostrarResultado(`Archivo ${archivo.name} procesado correctamente`);
                        
                    } catch (error) {
                        console.error(`Error procesando ${archivo.name}:`, error);
                        updateRowStatus(i, {
                            estado: 'Error',
                            importe: 'Error'
                        });
                        
                        mostrarResultado(`Error procesando ${archivo.name}: ${error.message}`, true);
                    } finally {
                        updateProgress(i + 1, selectedFiles.length);
                    }
                }
                
                isProcessing = false;
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
